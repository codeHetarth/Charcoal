<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset</title>
  <link rel="stylesheet" href="forgotpassword.css"> 
</head>

<body>
    <header>
        <nav class="navbar">
          <!-- Left side of the navigation bar of the webpage -->
          <div>
            <a class="logo" href="#" id="logoLink">
                  <img src="#">
                  <span>Charcoal</span>
            </a>
          </div>
        </nav>
    </header>


    <!-- Forgot Password email requirements -->

    <section class="forgot-password-section">
        <div id="forgot-password-view" class="forgot-password-view" action="#forgotpassword">
            <div class="forgot-password-div1">
                <h1>Forgot Password</h1>
                <p>Enter your email address to reset password !</p>
            </div>

            <div class="forgot-password-form">
                <form id="forgotPasswordForm" action="#">
                    <input type="email" name="email" placeholder="Email Address" required autocomplete="email">
                    <button type="submit">Submit</button>
                </form>
            </div>

            <div class="forgot-password-div3">
                <a href="auth.html" id="">Back to Login</a>
            </div>
        </div>
    </section>


    <script>
            
        const forgotPasswordForm = document.getElementById("forgotPasswordForm");

        forgotPasswordForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = forgotPasswordForm.email.value;

            await fetch("/auth/forgot-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email })
            });

            document.getElementById("forgot-password-view").innerHTML = `
                <div class="forgot-password-email">
                    <h1>Check your email</h1>
                    <p>
                        If an account exists for <strong>${email}</strong>,
                        a password reset link has been sent to your email.
                    </p>
                </div>

                <div class="forgot-password-div3">
                    <a href="auth.html">Back to Login</a>
                </div>
            `;
        });

    </script>
</body>
