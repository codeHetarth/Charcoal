<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset</title>
  <link rel="stylesheet" href="forgotpassword.css">
    <!-- Standard icon (browser tab) -->
    <link rel="icon" type="image/x-icon" href="/Logo/logo.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/Logo/logo16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/Logo/logo32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/Logo/logo48x48.png">
  
    <!-- Apple icon (iPhone/iPad home screen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/Logo/logo180x180.png">
  
    <!-- Android icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/Logo/logo192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/Logo/logo512x512.png">
  
    
  
</head>

<body>
    <header>
        <nav class="navbar">
          <!-- Brand control occupying the left-hand side of the navigation bar. -->
          <div>
            <a class="logo" href="landingpage.html" id="logoLink">
                  <img src="Logo.png">
                  <span>Charcoal</span>
            </a>
          </div>
        </nav>
    </header>


    <!-- Request view: the user supplies an email address to initiate a password reset. -->

    <section class="forgot-password-section">
        <div id="forgot-password-view" class="forgot-password-view" action="#forgotpassword">
            <div class="forgot-password-div1">
                <h1>Forgot Password</h1>
                <p>Enter your email address to reset password !</p>
            </div>

            <div class="forgot-password-form">
                <form id="forgotPasswordForm" action="#">
                    <input type="email" name="email" placeholder="Email Address" required autocomplete="email">
                    <button type="submit">Submit</button>
                </form>
            </div>

            <div class="forgot-password-div3">
                <a href="auth.html" id="">Back to Login</a>
            </div>
        </div>
    </section>


    <script src="forgotpassword.js"></script>
</body>
