<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset</title>
  <!-- Standard icon (browser tab) -->
  <link rel="icon" type="image/x-icon" href="/Logo/logo.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/Logo/logo16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/Logo/logo32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/Logo/logo48x48.png">

  <!-- Apple icon (iPhone/iPad home screen) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/Logo/logo180x180.png">

  <!-- Android icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/Logo/logo192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/Logo/logo512x512.png">
  
  <link rel="stylesheet" href="forgotpassword.css">

</head>

<body>
    <header>
        <nav class="navbar">
          <!-- Brand control occupying the left-hand side of the navigation bar. -->
          <div>
            <a class="logo" href="landingpage.html" id="logoLink">
                  <img src="/Logo/Logo.png">
                  <span>Charcoal</span>
            </a>
          </div>
        </nav>
    </header>




<!--
  The reset-password layout reuses the forgot-password stylesheet.
  Shared class names therefore apply the same visual treatment to both forms.
-->


<section class="forgot-password-section">
    <div id="forgot-password-view" class="forgot-password-view">

        <div class="forgot-password-div1">
            <h1>Reset Password</h1>
            <p>Enter your new password below.</p>
        </div>

        <div class="forgot-password-form">
            <form id="resetPasswordForm">

                <p class="password-hint">At least 8 characters. 
                    <br>Do not use your name, email, or a common password.</p>
                <input type="password" name="password" placeholder="New Password" required autocomplete="new-password" minlength="8" maxlength="128">
                <input type="password" name="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password" minlength="8" maxlength="128">

                <button type="submit">Reset Password</button>

            </form>
        </div>

        <div class="forgot-password-div3">
            <a href="auth.html">Back to Login</a>
        </div>

    </div>
</section>

<script src="password-policy.js"></script>
<script src="resetpassword.js"></script>
