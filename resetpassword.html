<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset</title>
  <link rel="stylesheet" href="forgotpassword.css"> 
</head>

<body>
    <header>
        <nav class="navbar">
          <!-- Left side of the navigation bar of the webpage -->
          <div>
            <a class="logo" href="#" id="logoLink">
                  <img src="#">
                  <span>Charcoal</span>
            </a>
          </div>
        </nav>
    </header>




<!-- Reset Password form uses the same CSS as the Forgot Password form 
     so we can reuse the same class names for the reset password form elements. -->




<section class="forgot-password-section">
    <div id="forgot-password-view" class="forgot-password-view">

        <div class="forgot-password-div1">
            <h1>Reset Password</h1>
            <p>Enter your new password below.</p>
        </div>

        <div class="forgot-password-form">
            <form id="resetPasswordForm">

                <input type="password" name="password" placeholder="New Password" required autocomplete="new-password">

                <input type="password" name="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password">

                <button type="submit">Reset Password</button>

            </form>
        </div>

        <div class="forgot-password-div3">
            <a href="auth.html">Back to Login</a>
        </div>

    </div>
</section>

<script>
    const resetPasswordForm = document.getElementById("resetPasswordForm");

    function showExpiredMessage() {
        document.getElementById("forgot-password-view").innerHTML = `
            <div class="forgot-password-email">
                <h1>Link expired</h1>
                <p>This password reset link is invalid or has expired. Please request a new one.</p>
            </div>
            <div class="forgot-password-div3">
                <a href="auth.html">Back to Login</a>
            </div>
        `;
    }

    // Runs once, immediately, when the page loads
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        if (!token) {
            showExpiredMessage();
            return;
        }

        const res = await fetch(`/auth/verify-reset-token?token=${encodeURIComponent(token)}`);
        const data = await res.json();

        if (!data.valid) {
            showExpiredMessage();
        }
    })();

    resetPasswordForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const password = resetPasswordForm.password.value;
        const confirmPassword = resetPasswordForm.confirmPassword.value;

        if (password !== confirmPassword) {
            resetPasswordForm.confirmPassword.setCustomValidity("Passwords do not match");
            resetPasswordForm.confirmPassword.reportValidity();
            return;
        }

        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        const response = await fetch("/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.error || "Something went wrong. Please try again.");
            return;
        }

        document.getElementById("forgot-password-view").innerHTML = `
            <div class="forgot-password-email">
                <h1>Password Reset Success</h1>
                <p>The password has been reset successfully.</p>
            </div>
            <div class="forgot-password-div3">
                <a href="auth.html">Back to Login</a>
            </div>
        `;
    });
</script>
